stages: [validate, test, build]

frontend:
  image: node:24-bookworm-slim
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    paths: [frontend/dist/]

backend:
  image: python:3.12-slim
  stage: test
  script:
    - cd backend
    - pip install -r requirements-dev.lock
    - pip install --no-deps -e .
    - ruff check .
    - ruff format --check .
    - pytest -q
    - python -m build
  artifacts:
    paths: [backend/dist/]

backend-container:
  image: docker:27-cli
  stage: build
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --tag saathi-api:ci backend
  # Requires a runner configured for Docker-in-Docker. No push or deployment.
